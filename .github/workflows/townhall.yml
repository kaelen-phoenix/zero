name: townhall

# The control room's daily report: what the line produced, what it cost,
# what the network learned and what needs a human.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

# Shares the group with the zero workflow so townhall writes never race.
concurrency:
  group: zero
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/cli.js briefing
